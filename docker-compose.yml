# Himalaya Airlines OBS: backend API + web app.
#   Start:  start.bat  (Windows)   or   ./start.sh  (macOS / Linux)
#   Manual: docker compose up -d --build
name: himalaya-obs

services:
  backend:
    build: ./backend
    image: himalaya-obs-backend:7.5
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      OBS_DB_PATH: /data/obs.db
      OBS_SECRET_KEY_FILE: /data/.obs_secret.key
      OBS_EMBEDDED_WORKER: "1"
    volumes:
      - obs-data:/data
    # Published for the iPad / Android app, which calls the API directly
    # (EXPO_PUBLIC_API_BASE=http://<server>:8005). The web app does not need it.
    ports:
      - "${API_PORT:-8005}:8000"

  web:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_API_BASE: /api
    image: himalaya-obs-web:7.3
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  # Database, WAL files and the generated encryption key. Survives rebuilds and
  # `docker compose down`; only `docker compose down -v` deletes it.
  obs-data:
