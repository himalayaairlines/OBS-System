<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koseli Menu - QR code</title>
<style>
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#F4F6F9;color:#16202B}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border:1px solid #DCE2EA;border-radius:14px;padding:24px;text-align:center}
h1{font-size:22px;margin:0 0 4px;color:#0B4F8A}
.sub{color:#5B6778;margin-bottom:16px}
#qr{width:min(70vw,320px);height:auto}
.url{font:600 18px/1.4 Consolas,monospace;margin:12px 0;word-break:break-all}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:8px;padding:11px 16px;font:600 14px inherit;cursor:pointer;background:#0B4F8A;color:#fff}
button.alt{background:#fff;color:#0B4F8A;border:1px solid #0B4F8A}
.meta{color:#5B6778;font-size:13px;margin-top:14px}
.other{font-size:13px;color:#5B6778;margin-top:6px}
@media print{body{background:#fff}.row,.meta,.other{display:none}.card{border:0}
  @page{size:A5;margin:12mm}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Koseli Onboard Menu</h1>
  <div class="sub">Scan to see the menu · 扫码查看菜单</div>
  <img id="qr" src="/qr.svg" alt="QR code">
  <div class="url" id="url"></div>
  <div class="row">
    <button onclick="window.print()">Print A5 table card</button>
    <button class="alt" onclick="png()">Download PNG</button>
    <button class="alt" onclick="window.open('/','_blank')">Open the menu</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="other" id="other"></div>
</div></div>
<script>
var last="";
function refresh(){fetch('/api/info',{cache:'no-store'}).then(function(r){return r.json()}).then(function(i){
  document.getElementById('url').textContent=i.url;
  document.getElementById('meta').textContent=i.devices+' device(s) opened the menu in the last 15 minutes';
  document.getElementById('other').textContent=i.urls.length>1?('Other addresses: '+i.urls.slice(1).join('  ')):'';
  if(i.url!==last){last=i.url;document.getElementById('qr').src='/qr.svg?t='+Date.now()}
}).catch(function(){})}
function png(){var img=document.getElementById('qr'),c=document.createElement('canvas');c.width=c.height=1024;
  var x=c.getContext('2d');var i=new Image();i.onload=function(){x.fillStyle='#fff';x.fillRect(0,0,1024,1024);x.drawImage(i,0,0,1024,1024);
  var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='koseli-menu-qr.png';a.click()};i.src=img.src}
refresh();setInterval(refresh,8000);
</script>
</body>
</html>
