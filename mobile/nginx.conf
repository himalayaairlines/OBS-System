# Serves the web build and forwards /api/* to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Excel imports (daily register) and similar uploads.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /api/login -> http://backend:8000/login
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SMTP tests and Excel exports can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Passenger QR menu: public, no sign-in. /menu -> backend /public/menu
    location = /menu {
        proxy_pass http://backend:8000/public/menu;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }
    location /menu/ {
        proxy_pass http://backend:8000/public/menu/;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    # Fingerprinted bundles never change, so cache them hard.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path loads index.html, never cached, so a
    # rebuilt image is picked up on the next reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
